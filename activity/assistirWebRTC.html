<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Live - Espectador WebRTC</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: #17191f;
            color: white;
            margin: 32px;
        }
        main{
            max-width: 1100px;
            margin: auto;
        }
        .controls{
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 18px 0;
            align-items: center;
        }
        input, button{
            padding: 10px;
        }
        button {
            cursor: pointer;
        }
        button:disabled{
            opacity: 0.5;
            cursor: not-allowed;
        }
        video{
            display: block;
            width: 100%;
            max-height: 600px;
            background: black;
        }
        pre{
            background: #101116;
            padding: 15px;
            height: 230px;
            overflow: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <main>
        <h1>Demo Live - Espectador WebRTC</h1>
        <p id="viewer-status">Desconectado.</p>
        <div class="controls">
            <input
                id="viewer-key"
                type="password"
                placeholder="Chave de visualização"
                autocomplete="off"
            >
            <button id="viewer-connect">
                Assistir via WebRTC
            </button>
            <button id="viewer-disconnect" disabled>
                Desconectar
            </button>
            <button id="viewer-sound" disabled>
                Ativar som
            </button>
        </div>
        
        <h2>Transmissão</h2>

        <video
            id="viewer-video"
            autoplay
            muted
            playsinline
            controls
        ></video>

        <h2>Diagnóstico WebRTC</h2>
        <pre id="viewer-logs"></pre>
    </main>
    <script type="module" src="./src/webrtcViewer.js"></script>
</body>
</html>
