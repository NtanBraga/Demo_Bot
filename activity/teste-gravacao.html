<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Live - Teste MediaRecorder</title>
    <style>
        body{
            background: #1e1f22;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        button{
            padding: 10px 16px;
            margin-right: 8px;
        }
        video{
            width: 100%;
            max-width: 900px;
            background: black;
        }
        pre{
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h2>Demo Live - Teste de captura</h2>

    <button id="iniciar">Iniciar Gravação</button>
    <button id="parar" disabled>Parar Gravção</button>

    <p id="status">Aguardando...</p>
    <pre id="logs"></pre>

    <h3>Resultado da gravação</h3>
    <video id="resultado" controls playsinline></video>

    <script>
        const iniciar = document.getElementById("iniciar");
        const parar = document.getElementById("parar");
        const status = document.getElementById("status");
        const logs = document.getElementById("logs");
        const resultado = document.getElementById("resultado");
        const canal = new BroadcastChannel("demo-live-mse")

        let stream = null;
        let recorder = null;
        let chunks = [];

        function log(mensagem) {
            console.log("[MediaRecorder]", mensagem);
            logs.textContent += mensagem + "\n";
        }

        document.addEventListener("visibilitychange", () => {
            log("Visibilidade: " + document.visibilityState);
        });

        iniciar.addEventListener("click", async () => {
            try {
                chunks = [];
                logs.textContent = "";

                if (!window.MediaRecorder) {
                    throw new Error("MediaRecorder indisponível.");
                }

                const formatos = [
                    "video/webm;codecs=vp8",
                    "video/webm;codecs=vp9",
                    "video/webm",
                    "video/mp4"
                ];

                const mimeType = formatos.find(
                    formato => MediaRecorder.isTypeSupported(formato)
                );

                if (!mimeType) {
                    throw new Error("Nenhum formato compatível.");
                }

                stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { frameRate: 30 },
                    audio: false
                });

                recorder = new MediaRecorder(stream, {
                    mimeType,
                    videoBitsPerSecond: 1_500_000
                });

                log("Formato: " + recorder.mimeType);

                recorder.addEventListener("dataavailable", event => {
                    if (event.data.size === 0) return;

                    chunks.push(event.data);

                    canal.postMessage({
                        type: "video:chunk",
                        blob: event.data
                    })

                    log(
                        "Chunk " + chunks.length +
                        " | " + event.data.size + " bytes" +
                        " | " + Math.round(performance.now()) + " ms"
                    );
                });

                recorder.addEventListener("stop", () => {
                    const blob = new Blob(chunks, {
                        type: recorder.mimeType
                    });

                    resultado.src = URL.createObjectURL(blob);

                    stream.getTracks().forEach(track => track.stop());

                    iniciar.disabled = false;
                    parar.disabled = true;

                    status.textContent = "Gravação concluída.";
                    log("Total gravado: " + blob.size + " bytes");
                });

                recorder.addEventListener("error", event => {
                    log("Erro: " + event.error?.message);
                });

                stream.getVideoTracks()[0].addEventListener("ended", () => {
                    if (recorder.state === "recording") {
                        recorder.stop();
                    }
                });

                recorder.start(1000);

                iniciar.disabled = true;
                parar.disabled = false;

                status.textContent = "Gravando...";
                log("Gravação iniciada.");

            } catch (error) {
                log("Erro: " + error.message);

                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }

                iniciar.disabled = false;
                parar.disabled = true;
            }
        });

        parar.addEventListener("click", () => {
            if (recorder?.state === "recording") {
                recorder.stop();
            }
        });
    </script>
</body>
</html>
